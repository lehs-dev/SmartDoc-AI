<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartDoc AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="main-content">
        <header class="header">
            <div class="logo">SmartDoc AI</div>
            <button class="new-chat-btn" onclick="location.reload()" title="Tạo cuộc hội thoại mới">
                <span class="material-symbols-outlined">add</span> Đoạn chat mới
            </button>
        </header>

        <div class="chat-wrapper">
            <div class="chat-history" id="chat-history">
                </div>

            <div class="input-container">
                <div class="input-box">
                    <div class="file-preview-area" id="file-preview-area" style="display: none;">
                        <div class="file-card">
                            <div class="file-info">
                                <span class="file-name" id="file-name"></span>
                                <span class="file-ext" id="file-ext"></span>
                            </div>
                            <button class="remove-file-btn" id="remove-file-btn" title="Xóa">
                                <span class="material-symbols-outlined">close</span>
                            </button>
                        </div>
                    </div>

                    <textarea id="chat-input" placeholder="Hỏi SmartDoc AI hoặc tải tài liệu lên..." rows="1"></textarea>
                    
                    <div class="input-toolbar">
                        <div class="toolbar-left">
                            <input type="file" id="file-upload" style="display: none;" accept=".pdf,.docx,.txt">
                            <button class="icon-btn" id="attach-btn" title="Đính kèm tài liệu">
                                <span class="material-symbols-outlined">attach_file</span>
                            </button>
                        </div>
                        <div class="toolbar-right">
                            <button class="icon-btn send-btn" id="send-btn" title="Gửi" disabled>
                                <span class="material-symbols-outlined">send</span>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="footer-text">SmartDoc AI có thể đưa ra thông tin không chính xác. Hãy kiểm tra lại.</div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.0.0/dist/markdown-it.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="chat.js"></script>
</body>
</html>
